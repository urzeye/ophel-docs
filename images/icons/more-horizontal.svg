<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="#4b5563" stroke="none" stroke-linecap="round" stroke-linejoin="round" class="more-horizontal-icon " style="display:block;width:18px;height:18px" color="#4b5563"><circle cx="12" cy="12" r="1.5" class="dot dot-2"></circle><circle cx="19" cy="12" r="1.5" class="dot dot-3"></circle><circle cx="5" cy="12" r="1.5" class="dot dot-1"></circle><style>
        .more-horizontal-icon .dot {
          transform-box: fill-box;
          transform-origin: center;
          animation: dot-jump 3s infinite;
        }
        .more-horizontal-icon .dot-1 {
          animation-delay: 0s;
        }
        .more-horizontal-icon .dot-2 {
          animation-delay: 0.1s;
        }
        .more-horizontal-icon .dot-3 {
          animation-delay: 0.2s;
        }
        @keyframes dot-jump {
          0%, 90%, 100% { transform: translateY(0); }
          5% { transform: translateY(-3px); }
          10% { transform: translateY(0); }
        }
      </style></svg>
